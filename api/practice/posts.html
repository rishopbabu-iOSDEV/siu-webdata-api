<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice: posts pager</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <main id="main-content">
    <h1>Practice: a posts pager</h1>
    <p>
      Module 3, Exercise 3. Ten posts at a time from JSONPlaceholder
      (<code>?_page=&amp;_limit=</code>, total from the <code>X-Total-Count</code> header).
      Not linked from the site's navigation.
    </p>

    <p class="status" id="posts-status" aria-live="polite"></p>
    <ol class="resume-list" id="posts"></ol>

    <div class="pager">
      <button type="button" class="button" id="prev">Previous</button>
      <span id="page-info"></span>
      <button type="button" class="button" id="next">Next</button>
    </div>
  </main>

  <script src="../../js/api.js" defer></script>
  <script src="posts.js" defer></script>
</body>
</html>
